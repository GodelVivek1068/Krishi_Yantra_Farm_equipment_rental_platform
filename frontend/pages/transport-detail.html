<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <title>Transport Detail - KrishiYantra</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .detail-page { max-width: 960px; margin: 40px auto; padding: 0 24px; }
    .back-link { color: var(--green-mid); font-size: 0.9rem; font-weight: 600; margin-bottom: 24px; display: inline-flex; align-items: center; gap: 6px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .detail-image {
      width: 100%; height: 320px; background: var(--green-pale);
      border-radius: var(--radius); display: flex; align-items: center;
      justify-content: center; font-size: 7rem; border: 1px solid var(--gray-200);
    }
    .detail-name { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--green-dark); margin-bottom: 10px; }
    .detail-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; font-size: 0.88rem; color: var(--gray-600); }
    .detail-meta span { display: flex; align-items: center; gap: 5px; }
    .detail-rating { margin-bottom: 14px; font-size: 0.9rem; color: var(--gray-600); display: flex; align-items: center; gap: 8px; }
    .detail-rating .star { color: #f59e0b; }
    .detail-price { font-size: 2rem; font-weight: 900; color: var(--green-mid); margin-bottom: 20px; }
    .detail-price small { font-size: 0.9rem; color: var(--gray-400); font-weight: 400; }
    .detail-desc { color: var(--gray-600); line-height: 1.7; margin-bottom: 24px; font-size: 0.93rem; }
    .owner-card {
      background: var(--green-pale); border-radius: var(--radius); padding: 16px;
      display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
    }
    .owner-avatar {
      width: 50px; height: 50px; background: var(--green-mid); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.2rem; font-weight: 700; flex-shrink: 0;
    }
    .owner-info h4 { font-weight: 700; color: var(--green-dark); margin-bottom: 2px; }
    .owner-info span { font-size: 0.82rem; color: var(--gray-600); }

    .booking-form { background: var(--white); border: 1.5px solid var(--gray-200); border-radius: var(--radius); padding: 24px; margin-top: 32px; }
    .booking-form h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--green-dark); margin-bottom: 20px; }
    .booking-summary {
      background: var(--green-pale); border-radius: var(--radius-sm); padding: 14px;
      margin: 16px 0; font-size: 0.9rem;
    }
    .booking-summary .summary-row { display: flex; justify-content: space-between; padding: 4px 0; }
    .booking-summary .summary-total { font-weight: 700; border-top: 1px solid var(--gray-200); padding-top: 8px; margin-top: 4px; color: var(--green-dark); font-size: 1rem; }

    .alt-wrap {
      margin-top: 24px;
      background: #fffdf3;
      border: 1px solid #f5de8d;
      border-radius: var(--radius);
      padding: 18px;
    }
    .alt-title {
      color: #7c4a03;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .alt-card {
      background: var(--white);
      border: 1px solid #f2d27a;
      border-radius: var(--radius-sm);
      padding: 12px;
    }
    .alt-name { font-weight: 700; color: var(--green-dark); margin-bottom: 6px; }
    .alt-meta { color: var(--gray-600); font-size: 0.84rem; margin-bottom: 8px; }
    .alt-price { color: var(--green-mid); font-weight: 800; margin-bottom: 8px; }

    @media(max-width:700px) {
      .detail-grid { grid-template-columns: 1fr; }
      .alt-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><i class="fa-solid fa-truck"></i><span>KrishiYantra</span></div>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Home</a></li>
      <li id="farmerMyRentalsNav" hidden><a href="my-rentals.html">My Rentals</a></li>
      <li id="farmerListEquipmentNav" hidden><a href="list-equipment.html">List Equipment</a></li>
      <li id="farmerServicesNav" class="service-menu">
        <button type="button" class="service-menu-toggle" aria-expanded="false">
          Services <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="service-menu-dropdown">
          <a href="equipment.html"><i class="fa-solid fa-tractor"></i> Equipment</a>
          <a href="kamgar.html"><i class="fa-solid fa-person-digging"></i> Worker</a>
          <a href="fertilizer.html"><i class="fa-solid fa-seedling"></i> Fertilizer</a>
          <a href="transport.html" class="active"><i class="fa-solid fa-truck"></i> Transport</a>
        </div>
      </li>
      <li><a href="my-transports.html">My Bookings</a></li>
      <li><a href="my-orders.html">My Orders</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-auth" id="navAuth">
      <a href="transport-login.html" class="btn-outline">Login</a>
      <a href="transport-register.html" class="btn-primary">Register</a>
    </div>
    <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
  </nav>

  <div class="detail-page">
    <a href="transport.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Transport</a>
    <div id="alertBox"></div>
    <div id="detailContent"><div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div></div>
  </div>

  <footer class="footer">
    <div class="footer-brand"><i class="fa-solid fa-truck"></i> KrishiYantra</div>
    <p>Empowering Indian Farmers</p>
    <p class="footer-copy">© 2024 KrishiYantra</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const transportId = urlParams.get('id');
    let currentTransport = null;
    let bookingDraft = {
      startDate: '',
      endDate: '',
      deliveryAddress: '',
      goodsDescription: ''
    };
    const ICONS = { tractor:'🚜', harvester:'🌾', rotavator:'⚙️', sprayer:'💧', thresher:'🌿', plough:'🔧', seeder:'🌱', pump:'🪣', truck:'🚛', van:'🚐', picker:'🚚', trailer:'🚛', container:'🚢', tanker:'🚛' };
    const safeText = (value) => String(value || '').replace(/[&<>"']/g, (m) => {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      if (m === '"') return '&quot;';
      return '&#39;';
    });

    function formatShortDate(rawDate) {
      const value = String(rawDate || '').trim();
      if (!value) return '';
      const parsed = new Date(`${value}T00:00:00`);
      if (Number.isNaN(parsed.getTime())) return value;
      return parsed.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function loadDetail() {
      if (!transportId) {
        showAlert('alertBox', 'Invalid transport link. Please open vehicle again from the list.', 'error');
        document.getElementById('detailContent').innerHTML = '';
        return;
      }
      if (!/^[a-f\d]{24}$/i.test(transportId)) {
        showAlert('alertBox', 'This transport link is outdated. Please open the vehicle again from the Transport page.', 'error');
        document.getElementById('detailContent').innerHTML = '<div class="no-results">Invalid transport ID format.</div>';
        return;
      }
      try {
        const res = await apiCall('GET', `/transport/${transportId}`);
        if (!res.transport) {
          throw new Error(res.error || 'Transport vehicle not found');
        }
        renderDetail(res.transport);
      } catch(e) {
        showAlert('alertBox', e.message || 'Unable to load transport from backend.', 'error');
        document.getElementById('detailContent').innerHTML = '<div class="no-results">Could not load transport details.</div>';
      }
    }

    function captureBookingDraft() {
      const startDate = document.getElementById('startDate');
      const endDate = document.getElementById('endDate');
      const deliveryAddress = document.getElementById('deliveryAddress');
      const goodsDescription = document.getElementById('goodsDescription');
      if (!startDate || !endDate || !deliveryAddress || !goodsDescription) return;
      bookingDraft = {
        startDate: startDate.value || '',
        endDate: endDate.value || '',
        deliveryAddress: deliveryAddress.value || '',
        goodsDescription: goodsDescription.value || ''
      };
    }

    function restoreBookingDraft(pricePerDay, isAvailable) {
      if (!isAvailable) return;
      const startDate = document.getElementById('startDate');
      const endDate = document.getElementById('endDate');
      const deliveryAddress = document.getElementById('deliveryAddress');
      const goodsDescription = document.getElementById('goodsDescription');
      if (!startDate || !endDate || !deliveryAddress || !goodsDescription) return;
      if (bookingDraft.startDate) startDate.value = bookingDraft.startDate;
      if (bookingDraft.endDate) endDate.value = bookingDraft.endDate;
      if (bookingDraft.deliveryAddress) deliveryAddress.value = bookingDraft.deliveryAddress;
      if (bookingDraft.goodsDescription) goodsDescription.value = bookingDraft.goodsDescription;
      if (startDate.value && endDate.value) {
        calcTotal(pricePerDay);
      }
    }

    function wireBookingDraftListeners() {
      const ids = ['startDate', 'endDate', 'deliveryAddress', 'goodsDescription'];
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', captureBookingDraft);
        el.addEventListener('change', captureBookingDraft);
      });
    }

    function renderDetail(vehicle) {
      captureBookingDraft();
      currentTransport = vehicle;
      const isAvailable = vehicle.available !== false;
      const pricePerDay = Number(vehicle.price_per_day || 0);
      const ratingAvg = Number(vehicle.rating_avg || 0);
      const ratingCount = Number(vehicle.rating_count || 0);
      const ratingLine = ratingCount > 0
        ? `<div class="detail-rating"><i class="fa-solid fa-star star"></i> ${ratingAvg.toFixed(1)} average rating from ${ratingCount} reviews</div>`
        : '<div class="detail-rating"><i class="fa-regular fa-star"></i> No ratings yet</div>';
      const icon = ICONS[vehicle.vehicle_type] || '🚛';
      const imageHtml = vehicle.image_url
        ? `<img src="${safeText(vehicle.image_url)}" alt="${safeText(vehicle.name)}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.textContent='${icon}'"/>`
        : icon;
      const bookedDays = Number(vehicle.unavailable_booked_days || 0);
      const availableOn = vehicle.unavailable_until_label || formatShortDate(vehicle.unavailable_until_date);
      const unavailabilityMessage = bookedDays > 0 && availableOn
        ? `This vehicle is already booked for ${bookedDays} day${bookedDays === 1 ? '' : 's'} and is expected to be available on ${availableOn}.`
        : (availableOn
          ? `This vehicle is already booked and is expected to be available on ${availableOn}.`
          : 'This vehicle is currently unavailable.');
      document.title = `${vehicle.name} - KrishiYantra`;
      document.getElementById('detailContent').innerHTML = `
        <div class="detail-grid">
          <div>
            <div class="detail-image">${imageHtml}</div>
          </div>
          <div class="detail-info">
            <span class="badge badge-green">${vehicle.vehicle_type || 'other'}</span>
            <h1 class="detail-name" style="margin-top:10px">${vehicle.name}</h1>
            <div class="detail-meta">
              <span><i class="fa-solid fa-location-dot"></i> ${vehicle.location}</span>
              ${isAvailable ? `<span><i class="fa-solid fa-circle" style="color:#22c55e;font-size:0.6rem"></i> Available</span>` : `<span><i class="fa-solid fa-circle" style="color:#ef4444;font-size:0.6rem"></i> Unavailable</span>`}
            </div>
            ${ratingLine}
            <div class="detail-price">₹${pricePerDay}<small>/day</small></div>
            <p class="detail-desc">${vehicle.description || 'Transport vehicle available for hire.'}</p>
            <div class="owner-card">
              <div class="owner-avatar">${(vehicle.owner_name || 'O').split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase()}</div>
              <div class="owner-info">
                <h4>${vehicle.owner_name || 'Owner'}</h4>
                <span><i class="fa-solid fa-phone"></i> ${vehicle.owner_phone || 'Contact via platform'}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="booking-form">
          <h3><i class="fa-solid fa-calendar-check"></i> Book This Vehicle</h3>
          ${!isAvailable ? `<div class="alert alert-warning">${unavailabilityMessage}</div>` : ''}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-group">
              <label>Start Date</label>
              <input type="date" id="startDate" min="${new Date().toISOString().split('T')[0]}" onchange="calcTotal(${pricePerDay})" ${isAvailable ? '' : 'disabled'}/>
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" id="endDate" min="${new Date().toISOString().split('T')[0]}" onchange="calcTotal(${pricePerDay})" ${isAvailable ? '' : 'disabled'}/>
            </div>
          </div>
          <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" id="deliveryAddress" placeholder="Pickup / delivery location" ${isAvailable ? '' : 'disabled'}/>
          </div>
          <div class="form-group">
            <label>Goods Description</label>
            <textarea id="goodsDescription" placeholder="Type of goods, weight estimate..." ${isAvailable ? '' : 'disabled'}></textarea>
          </div>
          <div class="booking-summary" id="bookingSummary" style="display:none">
            <div class="summary-row"><span>Price per day</span><span>₹${pricePerDay}</span></div>
            <div class="summary-row"><span>Number of days</span><span id="numDays">-</span></div>
            <div class="summary-row summary-total"><span>Total Amount</span><span id="totalAmt">-</span></div>
          </div>
          <button id="bookBtn" class="btn-green" style="width:100%;justify-content:center;padding:13px;" onclick="bookTransport('${vehicle._id}', ${pricePerDay})" ${isAvailable ? '' : 'disabled'}>
            <i class="fa-solid fa-check-circle"></i> ${isAvailable ? 'Confirm & Pay' : 'Currently Booked'}
          </button>
        </div>
      `;
      restoreBookingDraft(pricePerDay, isAvailable);
      wireBookingDraftListeners();
    }

    function calcTotal(pricePerDay) {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      if (!s || !e) return;
      const days = Math.ceil((new Date(e) - new Date(s)) / 86400000);
      if (days <= 0) { document.getElementById('bookingSummary').style.display='none'; return; }
      document.getElementById('numDays').textContent = days;
      document.getElementById('totalAmt').textContent = `₹${days * pricePerDay}`;
      document.getElementById('bookingSummary').style.display = 'block';
    }

    async function bookTransport(transportIdParam, pricePerDay) {
      if (!isLoggedIn()) {
        window.location.href = `transport-login.html?redirect=${encodeURIComponent(`transport-detail.html?id=${transportIdParam}`)}`;
        return;
      }
      if (typeof Razorpay === 'undefined') {
        showAlert('alertBox', 'Payment gateway failed to load. Please refresh and try again.', 'error');
        return;
      }
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const deliveryAddress = document.getElementById('deliveryAddress').value;
      const goodsDescription = document.getElementById('goodsDescription').value;
      if (!startDate || !endDate || !deliveryAddress) {
        showAlert('alertBox', 'Please fill all required fields', 'error'); return;
      }
      const days = Math.ceil((new Date(endDate) - new Date(startDate)) / 86400000);
      if (days <= 0) { showAlert('alertBox', 'End date must be after start date', 'error'); return; }
      const totalAmount = days * pricePerDay;
      const bookBtn = document.getElementById('bookBtn');
      if (bookBtn) {
        bookBtn.disabled = true;
        bookBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Payment...';
      }
      const bookingPayload = {
        transport_id: transportIdParam,
        start_date: startDate,
        end_date: endDate,
        delivery_address: deliveryAddress,
        goods_description: goodsDescription,
        total_amount: totalAmount
      };
      try {
        const order = await apiCall('POST', '/transport/payment/order', bookingPayload, true);
        const user = getUser() || {};
        const options = {
          key: order.key_id,
          amount: order.amount,
          currency: order.currency || 'INR',
          name: 'KrishiYantra',
          description: 'Transport Booking Payment',
          order_id: order.order_id,
          prefill: {
            name: (order.prefill && order.prefill.name) || user.name || '',
            email: (order.prefill && order.prefill.email) || user.email || '',
            contact: (order.prefill && order.prefill.contact) || user.phone || ''
          },
          theme: { color: '#2d7a4f' },
          handler: async function (paymentResponse) {
            try {
              const verifyPayload = {
                ...bookingPayload,
                razorpay_order_id: paymentResponse.razorpay_order_id,
                razorpay_payment_id: paymentResponse.razorpay_payment_id,
                razorpay_signature: paymentResponse.razorpay_signature
              };
              const verifyRes = await apiCall('POST', '/transport/payment/verify', verifyPayload, true);
              if (verifyRes.rental) {
                bookingDraft = { startDate: '', endDate: '', deliveryAddress: '', goodsDescription: '' };
                showAlert('alertBox', 'Payment successful. Transport booking request sent to owner for confirmation.', 'success');
                setTimeout(() => window.location.href = 'my-transports.html', 1800);
              } else {
                showAlert('alertBox', 'Payment verified but booking could not be created.', 'error');
              }
            } catch (verifyErr) {
              showAlert('alertBox', verifyErr.message || 'Payment verification failed.', 'error');
            } finally {
              if (bookBtn) {
                bookBtn.disabled = false;
                bookBtn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Confirm & Pay';
              }
            }
          },
          modal: {
            ondismiss: function () {
              showAlert('alertBox', 'Payment cancelled. Booking was not created.', 'info');
              if (bookBtn) {
                bookBtn.disabled = false;
                bookBtn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Confirm & Pay';
              }
            }
          }
        };
        const rzp = new Razorpay(options);
        rzp.open();
      } catch(e) {
        if (bookBtn) {
          bookBtn.disabled = false;
          bookBtn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Confirm & Pay';
        }
        if ((e.message || '').toLowerCase().includes('currently unavailable') || (e.message || '').toLowerCase().includes('transport is unavailable')) {
          showAlert('alertBox', 'This vehicle became unavailable. Please choose another vehicle.', 'error');
          if (currentTransport) {
            currentTransport.available = false;
            renderDetail(currentTransport);
          }
          return;
        }
        showAlert('alertBox', e.message || 'Payment initialization failed. Please try again.', 'error');
      }
    }

    loadDetail();
  </script>
</body>
</html>
