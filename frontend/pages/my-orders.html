<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <title>My Orders - KrishiYantra</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .page-header { background: linear-gradient(135deg, var(--green-dark), #2d6a4f); color: white; padding: 48px 24px 36px; text-align: center; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; }
    .orders-page { max-width: 980px; margin: 40px auto; padding: 0 24px 56px; }
    .order-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
    .order-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .order-name { font-size: 1.15rem; font-weight: 800; color: var(--green-dark); }
    .order-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 0.83rem; color: var(--gray-600); }
    .order-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .order-actions { display: flex; align-items: center; gap: 10px; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 10px; font-weight: 700; font-size: 0.72rem; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .amount { font-weight: 800; color: var(--green-mid); font-size: 1.12rem; white-space: nowrap; }
    .order-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .order-filter { border: 1px solid var(--gray-200); background: white; color: var(--gray-600); border-radius: 999px; padding: 8px 14px; cursor: pointer; font: inherit; }
    .order-filter.active { background: var(--green-dark); border-color: var(--green-dark); color: white; }
    .order-service { color: var(--green-mid); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .no-orders { text-align: center; padding: 60px; color: var(--gray-400); }
    .login-prompt { text-align: center; padding: 60px; }
    .login-prompt h3 { font-family: 'Playfair Display', serif; color: var(--green-dark); margin-bottom: 16px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><i class="fa-solid fa-tractor"></i><span>KrishiYantra</span></div>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Home</a></li>
      <li id="farmerMyRentalsNav" hidden><a href="my-rentals.html">My Rentals</a></li>
      <li id="farmerListEquipmentNav" hidden><a href="list-equipment.html">List Equipment</a></li>
      <li id="farmerServicesNav" class="service-menu">
        <button type="button" class="service-menu-toggle" aria-expanded="false">
          Services <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="service-menu-dropdown">
          <a href="equipment.html"><i class="fa-solid fa-tractor"></i> Equipment</a>
          <a href="kamgar.html"><i class="fa-solid fa-person-digging"></i> Worker</a>
          <a href="fertilizer.html"><i class="fa-solid fa-seedling"></i> Fertilizer</a>
          <a href="transport.html"><i class="fa-solid fa-truck"></i> Transport</a>
        </div>
      </li>
      <li><a href="my-orders.html" class="active">My Orders</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-auth" id="navAuth"><a href="login.html" class="btn-outline">Login</a><a href="register.html" class="btn-primary">Register</a></div>
    <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
  </nav>

  <div class="page-header">
    <h1>My Orders</h1>
    <p>Track your equipment, worker, transport, and fertilizer orders</p>
  </div>

  <div class="orders-page" id="pageContent">
    <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    function statusClass(status) {
      const value = String(status || '').toLowerCase();
      if (['delivered', 'paid', 'confirmed'].includes(value)) return 'badge-green';
      if (['requested', 'accepted', 'packed', 'pending'].includes(value)) return 'badge-amber';
      return 'badge-red';
    }

    function orderValue(value, fallback = 'Not provided') {
      return escapeHtml(value || fallback);
    }

    function formatAmount(value) {
      return `₹${Number(value || 0).toLocaleString('en-IN')}`;
    }

    let allOrders = [];
    let activeFilter = 'all';

    function renderOrders() {
      const page = document.getElementById('pageContent');
      const orders = activeFilter === 'all'
        ? allOrders
        : allOrders.filter(order => order.service === activeFilter);

      if (!orders.length) {
        page.innerHTML = `<div class="no-orders"><i class="fa-solid fa-receipt"></i>No orders found for this service.<br/><a href="../index.html" class="btn-green" style="display:inline-flex;margin-top:20px">Browse Services</a></div>`;
        return;
      }

      page.innerHTML = `
        <div class="order-filters">
          ${['all', 'equipment', 'workers', 'transport', 'fertilizer'].map(filter => `
            <button class="order-filter ${activeFilter === filter ? 'active' : ''}" type="button" data-filter="${filter}">
              ${filter === 'all' ? 'All Orders' : filter.charAt(0).toUpperCase() + filter.slice(1)}
            </button>`).join('')}
        </div>
        ${orders.map(order => `
          <div class="order-card">
            <div class="order-top">
              <div>
                <div class="order-service">${order.serviceLabel}</div>
                <div class="order-name">${orderValue(order.name)}</div>
                <div class="order-meta">
                  <span><i class="fa-solid fa-calendar"></i> ${orderValue(order.date)}</span>
                  <span><i class="fa-solid fa-location-dot"></i> ${orderValue(order.location, 'Farm location')}</span>
                </div>
              </div>
              <div class="order-actions">
                <span class="badge ${statusClass(order.status)}">${orderValue(order.status, 'pending')}</span>
                <span class="amount">${formatAmount(order.amount)}</span>
              </div>
            </div>
            <div class="order-meta">
              <span><i class="fa-solid fa-tag"></i> Order type: ${order.serviceLabel}</span>
              ${order.detail ? `<span><i class="fa-solid fa-circle-info"></i> ${orderValue(order.detail)}</span>` : ''}
            </div>
          </div>
        `).join('')}`;

      page.querySelectorAll('[data-filter]').forEach(button => {
        button.addEventListener('click', () => {
          activeFilter = button.dataset.filter;
          renderOrders();
        });
      });
    }

    async function init() {
      const page = document.getElementById('pageContent');
      if (!isLoggedIn()) {
        page.innerHTML = `
          <div class="login-prompt">
            <h3>Please Login to View Your Orders</h3>
            <p style="color:var(--gray-600);margin-bottom:24px">Track equipment, worker, transport, and fertilizer orders in one place.</p>
            <a href="login.html?redirect=my-orders.html" class="btn-green" style="display:inline-flex">
              <i class="fa-solid fa-right-to-bracket"></i> Login Now
            </a>
          </div>`;
        return;
      }

      page.innerHTML = '<div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading your orders...</div>';
      try {
        const responses = await Promise.allSettled([
          apiCall('GET', '/rentals/my', null, true),
          apiCall('GET', '/kamgar/jobs/my', null, true),
          apiCall('GET', '/transport/my-bookings', null, true),
          apiCall('GET', '/fertilizer/orders/my', null, true)
        ]);
        const [rentals, jobs, transports, fertilizer] = responses.map(response => response.status === 'fulfilled' ? response.value : {});
        const user = getUser() || {};

        allOrders = [
          ...(rentals.rentals || []).map(order => ({
            service: 'equipment', serviceLabel: 'Equipment', name: order.equipment_name,
            date: `${order.start_date || ''} → ${order.end_date || ''}`, location: order.delivery_address,
            status: order.status, amount: order.total_amount, detail: 'Equipment rental'
          })),
          ...(jobs.jobs || []).filter(order => {
            const uid = String(user._id || user.id || '');
            return uid && String(order.farmer_id) === uid;
          }).map(order => ({
            service: 'workers', serviceLabel: 'Workers', name: order.title,
            date: `${order.start_date || ''} → ${order.end_date || ''}`, location: order.location,
            status: order.status, amount: order.estimated_cost, detail: `Worker: ${order.worker_name || 'Assigned worker'}`
          })),
          ...(transports.rentals || []).map(order => ({
            service: 'transport', serviceLabel: 'Transport', name: order.transport_name,
            date: `${order.start_date || ''} → ${order.end_date || ''}`, location: order.delivery_address,
            status: order.status, amount: order.total_amount, detail: 'Transport booking'
          })),
          ...(fertilizer.orders || []).map(order => ({
            service: 'fertilizer', serviceLabel: 'Fertilizer', name: order.product_name,
            date: order.delivery_date, location: order.delivery_location,
            status: order.status, amount: order.total_amount, detail: `Supplier: ${order.supplier_name || 'Supplier'}`
          }))
        ];
        renderOrders();
      } catch (error) {
        page.innerHTML = `<div class="no-orders"><i class="fa-solid fa-circle-exclamation"></i>Unable to load orders.<br><small>${error.message || 'Please try again later.'}</small></div>`;
      }
    }

    init();
  </script>
</body>
</html>
