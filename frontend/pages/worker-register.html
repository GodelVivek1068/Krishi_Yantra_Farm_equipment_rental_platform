<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" type="image/svg+xml" href="../favicon.svg" /><title>Worker Account - KrishiYantra</title><link rel="stylesheet" href="../css/main.css" /><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" /><style>body{min-height:100vh;background:linear-gradient(135deg,var(--green-dark),#2d6a4f);display:flex;flex-direction:column}.auth-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}.auth-card{background:var(--white);border-radius:20px;padding:40px 36px;width:100%;max-width:480px;box-shadow:var(--shadow-lg)}.auth-logo{text-align:center;margin-bottom:24px}.auth-logo i{font-size:2rem;color:var(--amber)}.auth-logo h2{font-family:'Playfair Display',serif;color:var(--green-dark);margin:8px 0 4px;font-size:1.5rem}.auth-logo p{color:var(--gray-600);margin:0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn-submit{width:100%;padding:13px;font-size:1rem;justify-content:center;border-radius:var(--radius-sm)}.auth-switch{text-align:center;margin-top:20px;font-size:.88rem;color:var(--gray-600)}.auth-switch a{color:var(--green-mid);font-weight:600}@media(max-width:640px){.two-col{grid-template-columns:1fr}.auth-card{padding:30px 22px}}</style></head><body data-register-role="kamgar"><nav class="navbar"><div class="nav-brand"><i class="fa-solid fa-person-digging"></i><span>KrishiYantra</span></div><div class="nav-auth"><a href="worker-login.html" class="btn-outline">Login</a></div></nav><div class="auth-wrapper"><div class="auth-card"><div class="auth-logo"><i id="registerIcon" class="fa-solid fa-person-digging"></i><h2 id="registerTitle">Worker Account</h2><p id="registerSubtitle"></p></div><div id="alertBox"></div><form id="registerForm" novalidate><div class="two-col"><div class="form-group"><label for="firstName">First Name</label><input id="firstName"
